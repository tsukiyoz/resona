name: Rust client core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rust-client.yml'
      - 'client/**'
      - 'internal/noiseudp/**'
      - 'internal/nativewire/**'
      - 'internal/nativeidentity/**'
      - 'internal/server/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '.github/workflows/rust-client.yml'
      - 'client/**'
      - 'internal/noiseudp/**'
      - 'internal/nativewire/**'
      - 'internal/nativeidentity/**'
      - 'internal/server/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: rust-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust / Go interop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Check Rust formatting and lint
        run: |
          cargo fmt --manifest-path client/Cargo.toml --check
          cargo clippy --locked --manifest-path client/Cargo.toml --all-targets -- -D warnings
      - name: Test Rust and real Go loopback peers
        run: cargo test --locked --manifest-path client/Cargo.toml
