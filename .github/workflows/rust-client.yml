name: Rust client core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rust-client.yml'
      - 'client/**'
      - 'tools/listening-bot/**'
      - 'native/client-audio/**'
      - 'native/opus/**'
      - 'native/speexdsp/**'
      - 'internal/noiseudp/**'
      - 'internal/nativewire/**'
      - 'internal/nativeidentity/**'
      - 'internal/server/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '.github/workflows/rust-client.yml'
      - 'client/**'
      - 'tools/listening-bot/**'
      - 'native/client-audio/**'
      - 'native/opus/**'
      - 'native/speexdsp/**'
      - 'internal/noiseudp/**'
      - 'internal/nativewire/**'
      - 'internal/nativeidentity/**'
      - 'internal/server/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: rust-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust / Go interop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Check Rust formatting and lint
        run: |
          cargo fmt --manifest-path client/Cargo.toml --check
          cargo fmt --manifest-path tools/listening-bot/Cargo.toml --check
      - name: Set up Windows pkg-config
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-pkgconf
      - name: Build official Opus for the Rust client
        env:
          RESONA_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          bash native/opus/build.sh
          if [[ "$RUNNER_OS" == Windows ]]; then
            pkg_config=$(cygpath -m "$RESONA_MSYS2_ROOT/mingw64/bin/pkg-config.exe")
            test -x "$pkg_config"
            echo "PKG_CONFIG=$pkg_config" >> "$GITHUB_ENV"
          fi
          echo "PKG_CONFIG_PATH=$PWD/build/native/opus-install/lib/pkgconfig" >> "$GITHUB_ENV"
          echo 'OPUS_STATIC=1' >> "$GITHUB_ENV"
      - name: Lint complete Rust audio core
        run: cargo clippy --locked --manifest-path client/Cargo.toml --features audio --all-targets -- -D warnings
      - name: Test Rust and real Go loopback peers
        run: cargo test --locked --manifest-path client/Cargo.toml --features audio
      - name: Test Rust listening sources against isolated Go server
        run: |
          CGO_ENABLED=0 go build -o "build/bin/listening-server$(go env GOEXE)" ./tools/listening-bot/server
          cargo clippy --locked --manifest-path tools/listening-bot/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path tools/listening-bot/Cargo.toml
