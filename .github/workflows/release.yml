name: Publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication; an older build must not replace the latest update feed.
concurrency:
  group: resona-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate release identity and update configuration
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          UPDATE_URL: ${{ vars.RESONA_UPDATE_URL }}
          UPDATE_PUBLIC_KEY: ${{ vars.RESONA_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test "$REF_TYPE" = tag
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$(tr -d '\r\n' < VERSION)"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD origin/main
          test -s "docs/releases/$RELEASE_TAG.md"
          test "$UPDATE_URL" = "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/manifest.json"
          test -n "$UPDATE_PUBLIC_KEY"
  windows:
    needs: validate
    uses: ./.github/workflows/windows-build.yml
  macos:
    needs: validate
    uses: ./.github/workflows/macos-build.yml
    secrets:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test signing and publication guards
        run: go test ./tools/release-manifest ./internal/updates
      - uses: actions/download-artifact@v8
        with:
          name: Resona-${{ github.ref_name }}-win-x64-${{ github.sha }}
          path: build/release/windows
      - uses: actions/download-artifact@v8
        with:
          name: Resona-${{ github.ref_name }}-macos-arm64-${{ github.sha }}
          path: build/release/arm64
      - uses: actions/download-artifact@v8
        with:
          name: Resona-${{ github.ref_name }}-macos-x64-${{ github.sha }}
          path: build/release/x64
      - name: Sign complete manifest and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RESONA_UPDATE_SIGNING_KEY: ${{ secrets.RESONA_UPDATE_SIGNING_KEY }}
          RESONA_UPDATE_PUBLIC_KEY: ${{ vars.RESONA_UPDATE_PUBLIC_KEY }}
        run: bash scripts/publish-release.sh
