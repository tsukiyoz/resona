name: macOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/macos-build.yml'
      - 'Makefile'
      - 'build/appicon.png'
      - 'desktop/**'
      - 'cmd/resona-core/**'
      - 'internal/**'
      - 'native/**'
      - 'third_party/**'
      - 'go.mod'
      - 'go.sum'
      - 'VERSION'
      - 'docs/noise-license.txt'
  pull_request:
    paths:
      - '.github/workflows/macos-build.yml'
      - 'Makefile'
      - 'build/appicon.png'
      - 'desktop/**'
      - 'cmd/resona-core/**'
      - 'internal/**'
      - 'native/**'
      - 'third_party/**'
      - 'go.mod'
      - 'go.sum'
      - 'VERSION'
      - 'docs/noise-license.txt'

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            machine: arm64
          - runner: macos-15-intel
            arch: x64
            machine: x86_64
    env:
      CARGO_BUILD_JOBS: '2'
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Set up WebRTC build tools
        run: brew install meson ninja
      - name: Resolve build version
        id: version
        env:
          BUILD_REF_TYPE: ${{ github.ref_type }}
          BUILD_REF_NAME: ${{ github.ref_name }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          base_version=$(tr -d '\r\n' < VERSION)
          [[ "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          desktop_version=$(cargo metadata --locked --no-deps --format-version 1 --manifest-path desktop/Cargo.toml | jq -er '.packages[] | select(.name == "resona-desktop") | .version')
          test "$desktop_version" = "$base_version"
          version="v${base_version}-dev"
          if [[ "$BUILD_REF_TYPE" == tag ]]; then
            test "$BUILD_REF_NAME" = "v${base_version}"
            version="$BUILD_REF_NAME"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test core and desktop
        run: |
          go test ./internal/...
          cargo test --locked --release --manifest-path desktop/Cargo.toml
      # PR code must never receive the signing identity or certificate secrets.
      - name: Import signing identity for trusted builds
        id: signing
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          [[ "$SIGNING_IDENTITY" =~ ^[0-9A-Fa-f]{40}$ ]]
          umask 077
          certificate="$RUNNER_TEMP/resona-signing.p12"
          keychain="$RUNNER_TEMP/resona-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -k "$keychain" -t cert -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$keychain" | grep -F "$SIGNING_IDENTITY" >/dev/null
          echo "RESONA_CODESIGN_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo 'signed=true' >> "$GITHUB_OUTPUT"
      - name: Build app bundle
        env:
          RESONA_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: make build-desktop VERSION="$RESONA_BUILD_VERSION"
      - name: Verify WebRTC processors with packaged library
        run: |
          RESONA_WEBRTC_PLUGIN_DIR="$PWD/desktop/dist/Resona.app/Contents/Frameworks" go test ./internal/audio ./internal/desktopipc
      - name: Verify and archive app
        env:
          CERTIFICATE_SIGNED: ${{ steps.signing.outputs.signed }}
          PACKAGE_ARCH: ${{ matrix.arch }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          app=desktop/dist/Resona.app
          plutil -lint "$app/Contents/Info.plist"
          for binary in resona-core resona-desktop; do
            test -x "$app/Contents/MacOS/$binary"
            test "$(lipo -archs "$app/Contents/MacOS/$binary")" = "$EXPECTED_MACHINE"
            codesign --verify --strict "$app/Contents/MacOS/$binary"
          done
          library="$app/Contents/Frameworks/libresona_webrtc_apm.dylib"
          test -f "$library"
          test "$(lipo -archs "$library")" = "$EXPECTED_MACHINE"
          codesign --verify --strict "$library"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/resona-core" --version
          ditto -c -k --sequesterRsrc --keepParent "$app" "desktop/dist/Resona-macos-${PACKAGE_ARCH}.zip"
          echo '### macOS test package' >> "$GITHUB_STEP_SUMMARY"
          if [[ "$CERTIFICATE_SIGNED" == true ]]; then
            echo 'Signed with the configured Apple certificate. Not notarized; a development certificate is not a Developer ID distribution certificate.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Ad-hoc signed PR/test package. Not notarized; macOS may require manual approval to open.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload macOS package
        uses: actions/upload-artifact@v6
        with:
          name: Resona-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}-${{ github.sha }}
          path: desktop/dist/Resona-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/resona-signing.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
          rm -f "$RUNNER_TEMP/resona-signing.p12"
