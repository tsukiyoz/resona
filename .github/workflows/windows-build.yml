name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/windows-build.yml'
      - 'build-windows.cmd'
      - 'build/appicon.png'
      - 'desktop/**'
      - 'cmd/resona-core/**'
      - 'internal/**'
      - 'native/**'
      - 'third_party/**'
      - 'go.mod'
      - 'go.sum'
      - 'VERSION'
  pull_request:
    paths:
      - '.github/workflows/windows-build.yml'
      - 'build-windows.cmd'
      - 'build/appicon.png'
      - 'desktop/**'
      - 'cmd/resona-core/**'
      - 'internal/**'
      - 'native/**'
      - 'third_party/**'
      - 'go.mod'
      - 'go.sum'
      - 'VERSION'

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve build version
        id: version
        shell: pwsh
        env:
          BUILD_REF_TYPE: ${{ github.ref_type }}
          BUILD_REF_NAME: ${{ github.ref_name }}
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --manifest-path desktop/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = ($metadata | ConvertFrom-Json).packages | Where-Object { $_.name -eq 'resona-desktop' }
          if (-not $package) { throw 'Desktop package metadata missing' }
          $baseVersion = (Get-Content -Raw VERSION).Trim()
          if ($baseVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid root VERSION' }
          if ($package.version -ne $baseVersion) { throw 'VERSION and desktop version disagree' }
          $version = "v$baseVersion-dev"
          if ($env:BUILD_REF_TYPE -eq 'tag') {
            if ($env:BUILD_REF_NAME -ne "v$baseVersion") { throw 'Tag and VERSION disagree' }
            $version = $env:BUILD_REF_NAME
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Set up UCRT64 compiler
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
      - name: Test native Windows credential storage
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          RESONA_CREDENTIAL_INTEGRATION: '1'
        run: |
          go test -count=1 ./internal/credentials
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test
        shell: pwsh
        env:
          RESONA_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          RESONA_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: ./desktop/scripts/build-windows.ps1 -Msys2Root $env:RESONA_MSYS2_ROOT -Version $env:RESONA_BUILD_VERSION
      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: Resona-${{ steps.version.outputs.version }}-win-x64-${{ github.sha }}
          path: desktop/dist/Resona-win-x64.zip
          if-no-files-found: error
          retention-days: 14
