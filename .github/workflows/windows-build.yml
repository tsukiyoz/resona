name: Windows build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve build version
        id: version
        shell: pwsh
        env:
          BUILD_REF_TYPE: ${{ github.ref_type }}
          BUILD_REF_NAME: ${{ github.ref_name }}
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --manifest-path desktop/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = ($metadata | ConvertFrom-Json).packages | Where-Object { $_.name -eq 'resona-desktop' }
          if (-not $package) { throw 'Desktop package metadata missing' }
          $baseVersion = (Get-Content -Raw VERSION).Trim()
          if ($baseVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid root VERSION' }
          if ($package.version -ne $baseVersion) { throw 'VERSION and desktop version disagree' }
          $version = "v$baseVersion-dev"
          if ($env:BUILD_REF_TYPE -eq 'tag') {
            if ($env:BUILD_REF_NAME -ne "v$baseVersion") { throw 'Tag and VERSION disagree' }
            $version = $env:BUILD_REF_NAME
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Set up native audio and reference-test compilers
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
      - name: Set up Rust toolchains before restoring cache
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --component llvm-tools-preview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fingerprint native build tools
        id: native-tools
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $packages = & "$env:MSYS2_ROOT\usr\bin\pacman.exe" -Q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tools = "$env:ImageOS`n$env:ImageVersion`n$env:MSYS2_ROOT`n" + ($packages -join "`n")
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($tools)
          $hash = [System.Security.Cryptography.SHA256]::HashData($bytes)
          "key=$([Convert]::ToHexString($hash).ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $nativeWorkspace = Join-Path $env:GITHUB_WORKSPACE 'native/webrtc-apm'
          $nativeTarget = Join-Path $env:RUNNER_TEMP '3a'
          $relativeTarget = [IO.Path]::GetRelativePath($nativeWorkspace, $nativeTarget)
          if ([IO.Path]::IsPathRooted($relativeTarget)) { throw 'Native cache requires workspace and target on the same drive' }
          "apm-target=$relativeTarget" >> $env:GITHUB_OUTPUT
      - name: Cache pinned native dependencies
        uses: actions/cache@v5
        with:
          path: |
            build/native/opus-source
            build/native/opus-build
            build/native/opus-install
            build/native/rnnoise
          key: native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-tools.outputs.key }}-${{ hashFiles('native/opus/**', 'native/rnnoise/prepare.sh', '.github/workflows/windows-build.yml') }}
      - name: Cache Rust and WebRTC dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3, Node.js 24
        with:
          shared-key: desktop-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-tools.outputs.key }}-${{ hashFiles('native/**', 'client/build.rs', 'desktop/build.rs', 'desktop/scripts/**', 'Makefile', '.github/workflows/windows-build.yml') }}
          workspaces: |
            client
            desktop
            native/webrtc-apm -> ${{ steps.native-tools.outputs.apm-target }}
          cache-bin: false
      - name: Build and test
        shell: pwsh
        env:
          RESONA_CREDENTIAL_INTEGRATION: '1'
          RESONA_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          RESONA_BUILD_VERSION: ${{ steps.version.outputs.version }}
          RESONA_UPDATE_URL: ${{ vars.RESONA_UPDATE_URL }}
          RESONA_UPDATE_PUBLIC_KEY: ${{ vars.RESONA_UPDATE_PUBLIC_KEY }}
        run: ./desktop/scripts/build-windows.ps1 -Msys2Root $env:RESONA_MSYS2_ROOT -Version $env:RESONA_BUILD_VERSION
      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: Resona-${{ steps.version.outputs.version }}-win-x64-${{ github.sha }}
          path: desktop/dist/Resona-win-x64.zip
          if-no-files-found: error
          retention-days: 14
