name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-build.yml'
      - 'build-windows.cmd'
      - 'build/appicon.png'
      - 'desktop/**'
      - 'cmd/resona-core/**'
      - 'internal/**'
      - 'third_party/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up UCRT64 compiler
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Test native Windows credential storage
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          RESONA_CREDENTIAL_INTEGRATION: '1'
        run: |
          go test -count=1 ./internal/credentials
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test
        shell: pwsh
        env:
          RESONA_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./desktop/scripts/build-windows.ps1 -Msys2Root $env:RESONA_MSYS2_ROOT
      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: Resona-v0.0.2-win-x64-${{ github.sha }}
          path: desktop/dist/Resona-win-x64.zip
          if-no-files-found: error
          retention-days: 14
