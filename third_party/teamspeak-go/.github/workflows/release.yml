name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: Verify build
        run: go build ./...
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
