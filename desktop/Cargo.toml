[package]
name = "resona-desktop"
version = "0.1.0"
edition = "2024"
description = "Native GPUI desktop client for Resona"

[build-dependencies]
embed-resource = "=3.0.11"

[dependencies]
anyhow = "1.0"
async-channel = "2.5"
base64 = "0.22"
chrono = "0.4"
dirs = "6.0"
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
global-hotkey = "=0.8.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
