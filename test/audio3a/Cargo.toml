[package]
name = "resona-3a-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
webrtc-audio-processing = { version = "=2.1.0", features = ["bundled"] }
nnnoiseless = { version = "=0.5.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
cpu-time = "1"
hound = "3.5"

[build-dependencies]
cc = "1"

[features]
rnnoise-little = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
