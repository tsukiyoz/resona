[package]
name = "resona-client"
version = "0.1.5"
edition = "2024"
publish = false
description = "UI-independent Resona client core (migration in progress)"

[dependencies]
snow = { version = "=0.10.0", default-features = false, features = ["std", "use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom", "risky-raw-split"] }
tokio = { version = "1.53", features = ["net", "sync", "time", "rt", "macros", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
zeroize = "1.8"
prost = "=0.14.4"
ed25519-dalek = "=2.2.0"
sha2 = "0.10"

[build-dependencies]
prost-build = "=0.14.4"
protoc-bin-vendored = "=3.2.0"

[dev-dependencies]
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
